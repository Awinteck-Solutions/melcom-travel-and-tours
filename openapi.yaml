components:
  schemas:
    # Request Schemas
    OneWayFlightSearch:
      type: object
      required:
        - origin
        - destination
        - departureDate
        - passengers
        - tripType
      properties:
        origin:
          type: string
          description: Origin airport IATA code
          example: "ACC"
        destination:
          type: string
          description: Destination airport IATA code
          example: "ABJ"
        departureDate:
          type: string
          format: date
          description: Departure date (YYYY-MM-DD)
          example: "2025-11-15"
        passengers:
          $ref: "#/components/schemas/PassengerType"
        tripType:
          type: string
          enum: ["oneway"]
          example: "oneway"
        cabin:
          $ref: "#/components/schemas/CabinClass"

    ReturnFlightSearch:
      type: object
      required:
        - origin
        - destination
        - departureDate
        - returnDate
        - passengers
        - tripType
      properties:
        origin:
          type: string
          description: Origin airport IATA code
          example: "ACC"
        destination:
          type: string
          description: Destination airport IATA code
          example: "ABJ"
        departureDate:
          type: string
          format: date
          description: Departure date (YYYY-MM-DD)
          example: "2025-11-15"
        returnDate:
          type: string
          format: date
          description: Return date (YYYY-MM-DD)
          example: "2025-11-20"
        passengers:
          $ref: "#/components/schemas/PassengerType"
        tripType:
          type: string
          enum: ["return"]
          example: "return"
        cabin:
          $ref: "#/components/schemas/CabinClass"

    MultiCityFlightSearch:
      type: object
      required:
        - origin
        - destinations
        - departureDates
        - passengers
        - tripType
      properties:
        origin:
          type: string
          description: Origin airport IATA code
          example: "ACC"
        destinations:
          type: string
          description: Comma-separated destination airport IATA codes
          example: "ABJ,LFW"
        departureDates:
          type: string
          description: Comma-separated departure dates (YYYY-MM-DD)
          example: "2025-11-15,2025-11-18"
        passengers:
          $ref: "#/components/schemas/PassengerType"
        tripType:
          type: string
          enum: ["multicity"]
          example: "multicity"
        cabin:
          $ref: "#/components/schemas/CabinClass"

    FlightBookingRequest:
      type: object
      required:
        - flightDetails
        - passengerInfo
        - contactInfo
      properties:
        flightDetails:
          type: object
          properties:
            flightKey:
              type: string
              description: Flight option key from search results
            pricingKey:
              type: string
              description: Pricing detail key from search results
        passengerInfo:
          type: array
          items:
            type: object
            properties:
              type:
                $ref: "#/components/schemas/PassengerType"
              title:
                type: string
                enum: ["Mr", "Mrs", "Ms", "Miss"]
              firstName:
                type: string
              lastName:
                type: string
              dateOfBirth:
                type: string
                format: date
              nationality:
                type: string
        contactInfo:
          type: object
          properties:
            email:
              type: string
              format: email
            phone:
              type: string
            address:
              type: object
              properties:
                street:
                  type: string
                city:
                  type: string
                country:
                  type: string
                postalCode:
                  type: string

    # Response Schemas
    FlightSearchResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "oneway flight search completed successfully"
        data:
          type: object
          description:
            GOL API response data containing flight offers, pricing, and
            itinerary details
          properties:
            GolApi:
              type: object
              properties:
                SecurityContent:
                  type: string
                PassiveSessionId:
                  type: string
                Settings:
                  type: object
                ResponseDetail:
                  type: object
                  properties:
                    SearchFlightsExtendedResponse_2:
                      type: object
                      properties:
                        FlightOffers:
                          type: array
                          items:
                            type: object
                        BestPriceOffers:
                          type: array
                          items:
                            type: object
        search_params:
          type: object
          description: Echo of search parameters used

    FlightDealsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Flight deals retrieved successfully"
        data:
          type: object
          description: GOL API response containing flight deals
          properties:
            GolApi:
              type: object
              properties:
                ResponseDetail:
                  type: object
                  properties:
                    GetFlightDealsResponse_2:
                      type: object
                      properties:
                        FlightDeals:
                          type: array
                          items:
                            type: object
                            properties:
                              Id:
                                type: string
                              Origin:
                                type: string
                              Destination:
                                type: string
                              Price:
                                type: string
                              Currency:
                                type: string

    FlightDealResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          description: Specific flight deal details

    FlightBookingResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Booking created successfully"
        data:
          type: object
          properties:
            bookingId:
              type: string
            status:
              type: string
              enum: ["confirmed", "pending", "cancelled"]
            totalPrice:
              type: number
            currency:
              type: string
            flightDetails:
              type: object
            passengerInfo:
              type: array
              items:
                type: object

    AirportSearchResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Airports retrieved successfully"
        data:
          type: object
          description: GOL API response containing airport information
          properties:
            GolApi:
              type: object
              properties:
                ResponseDetail:
                  type: object
                  properties:
                    GetAirportsResponse_2:
                      type: object
                      properties:
                        Airports:
                          type: array
                          items:
                            type: object
                            properties:
                              Code:
                                type: string
                                example: "LHR"
                              Name:
                                type: string
                                example: "London Heathrow"
                              City:
                                type: string
                                example: "London"
                              Country:
                                type: string
                                example: "GB"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Error description"
        error:
          type: string
          description: Detailed error information

    # Enum Schemas
    PassengerType:
      type: string
      enum:
        - "ADT" # Adults (25-59)
        - "CHD" # Children (2-11 or up to 18)
        - "INF" # Infants (Up to 2 years)
        - "YTH" # Youth (12-24)
        - "YCD" # Seniors (60+)
      example: "ADT"
      description: |
        Passenger type codes:
        - ADT: Adults (25-59)
        - CHD: Children (2-11 or up to 18)
        - INF: Infants (Up to 2 years)
        - YTH: Youth (12-24)
        - YCD: Seniors (60+)

    CabinClass:
      type: string
      enum:
        - "ECO" # Economy class
        - "PRE" # Premium economy class
        - "BUS" # Business class
        - "1ST" # First class
      example: "ECO"
      description: |
        Cabin class codes:
        - ECO: Economy class
        - PRE: Premium economy class
        - BUS: Business class
        - 1ST: First class

    TripType:
      type: string
      enum:
        - "oneway"
        - "return"
        - "multicity"
        - "two_one_ways"
        - "special_offers"
      example: "oneway"
      description: |
        Trip type options:
        - oneway: One way trip
        - return: Return trip
        - multicity: Multi-city trip
        - two_one_ways: Two separate one-way tickets
        - special_offers: Special offer deals

    # Blog Schemas
    Blog:
      type: object
      properties:
        id:
          type: string
          example: "60f5b7b4a1b2c3d4e5f6g7h8"
        title:
          type: string
          example: "Top 10 Travel Destinations in 2025"
        content:
          type: string
          example:
            "Discover amazing travel destinations for your next adventure..."
        excerpt:
          type: string
          example: "A comprehensive guide to the best travel destinations..."
        author:
          type: object
          properties:
            id:
              type: string
              example: "60f5b7b4a1b2c3d4e5f6g7h9"
            name:
              type: string
              example: "John Doe"
            email:
              type: string
