            type: string
          example: ["travel", "destinations", "2025"]
        featuredImage:
          type: string
          example: "https://example.com/images/blog-featured.jpg"
        publishedAt:
          type: string
          format: date-time
          example: "2025-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2025-01-15T10:30:00Z"
        status:
          type: string
          enum: ["draft", "published", "archived"]
          example: "published"
        viewCount:
          type: integer
          example: 1250
        readTime:
          type: integer
          description: Estimated reading time in minutes
          example: 8

    CreateBlogRequest:
      type: object
      required:
        - title
        - content
        - category
      properties:
        title:
          type: string
          example: "Top 10 Travel Destinations in 2025"
        content:
          type: string
          example:
            "Discover amazing travel destinations for your next adventure..."
        excerpt:
          type: string
          example: "A comprehensive guide to the best travel destinations..."
        category:
          type: string
          example: "travel-tips"
        tags:
          type: array
          items:
            type: string
          example: ["travel", "destinations", "2025"]
        featuredImage:
          type: string
          example: "https://example.com/images/blog-featured.jpg"
        status:
          type: string
          enum: ["draft", "published"]
          default: "draft"
          example: "published"

    UpdateBlogRequest:
      type: object
      properties:
        title:
          type: string
          example: "Updated: Top 10 Travel Destinations in 2025"
        content:
          type: string
          example: "Updated content with amazing travel destinations..."
        excerpt:
          type: string
          example:
            "Updated comprehensive guide to the best travel destinations..."
        category:
          type: string
          example: "travel-tips"
        tags:
          type: array
          items:
            type: string
          example: ["travel", "destinations", "2025", "updated"]
        featuredImage:
          type: string
          example: "https://example.com/images/blog-featured-updated.jpg"
        status:
          type: string
          enum: ["draft", "published", "archived"]
          example: "published"

    # Recommended Country Schemas
    RecommendedCountry:
