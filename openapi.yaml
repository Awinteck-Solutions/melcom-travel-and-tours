openapi: 3.1.0
info:
  title: Melcom Travel & Tours API
  description: |
    A comprehensive travel platform API providing flight booking, content management, analytics, and user authentication services.

    This API provides:
    - User authentication with Google OAuth support
    - Real-time flight search and booking
    - Flight deals and promotional offers
    - Blog and content management system
    - Recommended countries and destinations
    - Contact forms and inquiry management
    - FAQ management
    - Analytics and tracking
    - Static content delivery

    **Base URL Development:** `http://localhost:4000`
    **Base URL Production:** `https://api.melcomtravels.com`

    **Authentication:** JWT tokens and Google OAuth supported.
  version: 2.0.0
  contact:
    name: Awinteck Solutions
    email: info@awinteck.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:4000
    description: Development server
  - url: https://api.melcomtravels.com
    description: Production server

tags:
  - name: Authentication
    description: User authentication and profile management
  - name: Flights
    description: Flight search, booking, deals, and airport information
  - name: Blogs
    description: Blog and content management
  - name: Recommended Countries
    description: Recommended destinations and countries
  - name: Content Management
    description: Static content and policies
  - name: Contact & Support
    description: Contact forms, inquiries, and FAQs
  - name: Analytics
    description: Analytics and tracking endpoints
  - name: Bookings
    description: General booking management

paths:
  # ========================
  # AUTHENTICATION ENDPOINTS
  # ========================
  /auth/register:
    post:
      summary: Register new user
      description: Create a new user account with email and password
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstname
                - lastname
                - email
                - password
              properties:
                firstname:
                  type: string
                  example: "John"
                lastname:
                  type: string
                  example: "Doe"
                email:
                  type: string
                  format: email
                  example: "john.doe@example.com"
                password:
                  type: string
                  minLength: 6
                  example: "securePassword123"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User registered successfully"
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "507f1f77bcf86cd799439011"
                      firstname:
                        type: string
                        example: "John"
                      lastname:
                        type: string
                        example: "Doe"
                      email:
                        type: string
                        example: "john.doe@example.com"
                      role:
                        type: string
                        example: "user"
                      token:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        "409":
          description: User already exists
        "400":
          description: Validation error

  /auth/login:
    post:
      summary: User login
      description: Authenticate user with email and password
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "john.doe@example.com"
                password:
                  type: string
                  example: "securePassword123"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Login successful"
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "507f1f77bcf86cd799439011"
                      email:
                        type: string
                        example: "john.doe@example.com"
                      firstname:
                        type: string
                        example: "John"
                      lastname:
                        type: string
                        example: "Doe"
                      role:
                        type: string
                        example: "user"
                      token:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        "401":
          description: Invalid credentials
        "404":
          description: User not found

  /auth/google:
    post:
      summary: Google OAuth authentication
      description: Authenticate user with Google ID token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idToken
              properties:
                idToken:
                  type: string
                  description: Google ID token from frontend
                  example: "eyJhbGciOiJSUzI1NiIsImtpZCI6IjdkYzAyN..."
      responses:
        "200":
          description: Google authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Google authentication successful"
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "507f1f77bcf86cd799439011"
                      email:
                        type: string
                        example: "john.doe@gmail.com"
                      firstname:
                        type: string
                        example: "John"
                      lastname:
                        type: string
                        example: "Doe"
                      role:
                        type: string
                        example: "user"
                      image:
                        type: string
                        example: "https://lh3.googleusercontent.com/..."
                      token:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        "401":
          description: Invalid Google token

  /flights/search:
    post:
      summary: Search for flights
      description: |
        Universal flight search endpoint supporting:
        - One-way flights
        - Return flights  
        - Multi-city flights

        Uses real-time data from GOL API integrated with Melcom Golibe platform.
      tags:
        - Flights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/OneWayFlightSearch"
                - $ref: "#/components/schemas/ReturnFlightSearch"
                - $ref: "#/components/schemas/MultiCityFlightSearch"
            examples:
              oneWay:
                summary: One-way flight search
                value:
                  origin: "ACC"
                  destination: "ABJ"
                  departureDate: "2025-11-15"
                  passengers: "ADT"
                  tripType: "oneway"
              return:
                summary: Return flight search
                value:
                  origin: "ACC"
                  destination: "ABJ"
                  departureDate: "2025-11-15"
                  returnDate: "2025-11-20"
                  passengers: "ADT"
                  tripType: "return"
              multiCity:
                summary: Multi-city flight search
                value:
                  origin: "ACC"
                  destinations: "ABJ,LFW"
                  departureDates: "2025-11-15,2025-11-18"
                  passengers: "ADT"
                  tripType: "multicity"
      responses:
        "200":
          description: Flight search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlightSearchResponse"
        "400":
          description: Bad request - missing required parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /flight-deals:
    get:
      summary: Get flight deals
      description: Get promotional flight deals and special offers from GOL API
      tags:
        - Flights
      parameters:
        - name: category
          in: query
          description: Filter deals by category
          required: false
          schema:
            type: string
            example: "promotional"
      responses:
        "200":
          description: List of flight deals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlightDealsResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /flight-deals/{id}:
    get:
      summary: Get flight deal by ID
      description: Get specific flight deal details by ID
      tags:
        - Flights
      parameters:
        - name: id
          in: path
          required: true
          description: Flight deal ID
          schema:
            type: string
      responses:
        "200":
          description: Flight deal details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlightDealResponse"
        "404":
          description: Flight deal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /flight-deals-categories:
    get:
      summary: Get flight deal categories
      description: Get available flight deal categories
      tags:
        - Flights
      responses:
        "200":
          description: List of flight deal categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        category:
                          type: string
                        description:
                          type: string

  /flight-bookings:
    post:
      summary: Create flight booking
      description: Create a new flight booking
      tags:
        - Flights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlightBookingRequest"
      responses:
        "201":
          description: Booking created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlightBookingResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /flight-bookings/{id}:
    get:
      summary: Get flight booking by ID
      description: Get flight booking details by ID
      tags:
        - Flights
      parameters:
        - name: id
          in: path
          required: true
          description: Flight booking ID
          schema:
            type: string
      responses:
        "200":
          description: Flight booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlightBookingResponse"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /airports:
    get:
      summary: Search airports
      description: Search for airports by name, city, or IATA code
      tags:
        - Flights
      parameters:
        - name: search
          in: query
          required: true
          description: Search term (airport name, city, or IATA code)
          schema:
            type: string
            example: "london"
      responses:
        "200":
          description: List of matching airports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AirportSearchResponse"
        "400":
          description: Bad request - search parameter required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Blogs Management Endpoints
  /blogs:
    get:
      tags:
        - Blogs
      summary: Get all blogs
      description:
        Retrieve a list of all published blogs with pagination support
      parameters:
        - name: page
          in: query
          description: Page number for pagination
          schema:
            type: integer
            default: 1
            example: 1
        - name: limit
          in: query
          description: Number of blogs per page
          schema:
            type: integer
            default: 10
            example: 10
        - name: category
          in: query
          description: Filter blogs by category
          schema:
            type: string
            example: "travel-tips"
      responses:
        "200":
          description: Successfully retrieved blogs
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Blogs retrieved successfully"
                  data:
                    type: object
                    properties:
                      blogs:
                        type: array
                        items:
                          $ref: "#/components/schemas/Blog"
                      pagination:
                        $ref: "#/components/schemas/Pagination"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Blogs
      summary: Create a new blog
      description: Create a new blog post (Admin only)
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBlogRequest"
      responses:
        "201":
          description: Blog created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Blog created successfully"
                  data:
                    $ref: "#/components/schemas/Blog"
        "400":
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /blogs/{id}:
    get:
      tags:
        - Blogs
      summary: Get blog by ID
      description: Retrieve a specific blog post by its ID
      parameters:
        - name: id
          in: path
          required: true
          description: Blog ID
          schema:
            type: string
            example: "60f5b7b4a1b2c3d4e5f6g7h8"
      responses:
        "200":
          description: Blog retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Blog retrieved successfully"
                  data:
                    $ref: "#/components/schemas/Blog"
        "404":
          description: Blog not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - Blogs
      summary: Update blog
      description: Update an existing blog post (Admin only)
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Blog ID
          schema:
            type: string
            example: "60f5b7b4a1b2c3d4e5f6g7h8"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBlogRequest"
      responses:
        "200":
          description: Blog updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Blog updated successfully"
                  data:
                    $ref: "#/components/schemas/Blog"
        "400":
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Blog not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Blogs
      summary: Delete blog
      description: Delete a blog post (Admin only)
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Blog ID
          schema:
            type: string
            example: "60f5b7b4a1b2c3d4e5f6g7h8"
      responses:
        "200":
          description: Blog deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Blog deleted successfully"
        "401":
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Blog not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Recommended Countries Endpoints
  /recommended-countries:
    get:
      tags:
        - Content Management
      summary: Get all recommended countries
      description: Retrieve a list of all recommended countries for travel
      responses:
        "200":
          description: Successfully retrieved recommended countries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Recommended countries retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecommendedCountry"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Content Management
      summary: Create recommended country
      description: Add a new country to the recommended list (Admin only)
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecommendedCountryRequest"
      responses:
        "201":
          description: Recommended country created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Recommended country created successfully"
                  data:
                    $ref: "#/components/schemas/RecommendedCountry"
        "400":
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /recommended-countries/filter:
    get:
      tags:
        - Content Management
      summary: Filter recommended countries
      description: Get recommended countries filtered by various criteria
      parameters:
        - name: region
          in: query
          description: Filter by region/continent
          schema:
            type: string
            example: "Africa"
        - name: budget
          in: query
          description: Filter by budget range
          schema:
            type: string
            enum: ["low", "medium", "high"]
            example: "medium"
        - name: season
          in: query
          description: Filter by best travel season
          schema:
            type: string
            example: "winter"
        - name: activities
          in: query
          description: Filter by available activities
          schema:
            type: string
            example: "safari,beach"
      responses:
        "200":
          description: Successfully retrieved filtered countries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Filtered countries retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecommendedCountry"
        "400":
          description: Bad request - invalid filter parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /recommended-countries/{id}:
    get:
      tags:
        - Content Management
      summary: Get recommended country by ID
      description: Retrieve a specific recommended country by its ID
      parameters:
        - name: id
          in: path
          required: true
          description: Recommended country ID
          schema:
            type: string
            example: "60f5b7b4a1b2c3d4e5f6g7h8"
      responses:
        "200":
          description: Recommended country retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Recommended country retrieved successfully"
                  data:
                    $ref: "#/components/schemas/RecommendedCountry"
        "404":
          description: Recommended country not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - Content Management
      summary: Update recommended country
      description: Update an existing recommended country (Admin only)
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Recommended country ID
          schema:
            type: string
            example: "60f5b7b4a1b2c3d4e5f6g7h8"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecommendedCountryRequest"
      responses:
        "200":
          description: Recommended country updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Recommended country updated successfully"
                  data:
                    $ref: "#/components/schemas/RecommendedCountry"
        "400":
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Recommended country not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Content Management
      summary: Delete recommended country
      description: Delete a recommended country (Admin only)
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Recommended country ID
          schema:
            type: string
            example: "60f5b7b4a1b2c3d4e5f6g7h8"
      responses:
        "200":
          description: Recommended country deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Recommended country deleted successfully"
        "401":
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Recommended country not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Static Content Endpoints
  /content/about-us:
    get:
      tags:
        - Content Management
      summary: Get About Us page content
      description: Retrieve the About Us page content
      responses:
        "200":
          description: About Us content retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "About Us content retrieved successfully"
                  data:
                    $ref: "#/components/schemas/StaticContent"

  /content/privacy-policy:
    get:
      tags:
        - Content Management
      summary: Get Privacy Policy content
      description: Retrieve the Privacy Policy page content
      responses:
        "200":
          description: Privacy Policy content retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Privacy Policy content retrieved successfully"
                  data:
                    $ref: "#/components/schemas/StaticContent"

  /content/terms-and-conditions:
    get:
      tags:
        - Content Management
      summary: Get Terms and Conditions content
      description: Retrieve the Terms and Conditions page content
      responses:
        "200":
          description: Terms and Conditions content retrieved successfully
          content:
            application/json:
