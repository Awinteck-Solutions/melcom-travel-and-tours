          type: string
          enum: ["general", "booking", "complaint", "suggestion", "technical"]
          example: "booking"

    ContactMessage:
      type: object
      properties:
        id:
          type: string
          example: "60f5b7b4a1b2c3d4e5f6g7h8"
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          example: "john.doe@example.com"
        phone:
          type: string
          example: "+233 20 123 4567"
