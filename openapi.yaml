          nullable: true
          example:
            "Thank you for your inquiry. We will get back to you shortly..."

    FAQ:
      type: object
      properties:
        id:
          type: string
          example: "60f5b7b4a1b2c3d4e5f6g7h8"
        question:
          type: string
          example: "How can I cancel my flight booking?"
        answer:
          type: string
          example:
            "You can cancel your flight booking by logging into your account and
            selecting the booking you wish to cancel..."
        category:
          type: string
          example: "booking"
        order:
          type: integer
          description: Display order for sorting FAQs
          example: 1
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2025-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2025-01-15T10:30:00Z"

    CreateFAQRequest:
      type: object
      required:
        - question
        - answer
        - category
      properties:
        question:
          type: string
          example: "How can I cancel my flight booking?"
        answer:
          type: string
          example:
            "You can cancel your flight booking by logging into your account..."
        category:
          type: string
          example: "booking"
        order:
          type: integer
          default: 0
          example: 1
        isActive:
          type: boolean
          default: true
          example: true

    UpdateFAQRequest:
      type: object
      properties:
        question:
          type: string
          example: "How can I cancel or modify my flight booking?"
        answer:
          type: string
          example:
            "Updated: You can cancel or modify your flight booking by logging
            into your account..."
        category:
          type: string
          example: "booking"
        order:
          type: integer
          example: 1
        isActive:
          type: boolean
          example: true

    # Booking Management Schemas
    Booking:
      type: object
      properties:
        id:
          type: string
          example: "60f5b7b4a1b2c3d4e5f6g7h8"
        type:
          type: string
          enum: ["flight", "hotel", "ride"]
          example: "flight"
        userId:
          type: string
          example: "60f5b7b4a1b2c3d4e5f6g7h9"
        bookingReference:
          type: string
          example: "MELCOM-FL-2025-001234"
        status:
          type: string
          enum: ["pending", "confirmed", "cancelled", "completed", "expired"]
          example: "confirmed"
        details:
          type: object
          description: Booking-specific details (varies by type)
          additionalProperties: true
          example:
            origin: "ACC"
            destination: "LHR"
            departureDate: "2025-11-15"
            passengerCount: 2
        totalAmount:
          type: object
          properties:
            currency:
              type: string
              example: "USD"
            amount:
              type: number
              format: float
              example: 1250.00
        paymentStatus:
          type: string
          enum: ["pending", "paid", "refunded", "failed"]
          example: "paid"
        createdAt:
          type: string
          format: date-time
          example: "2025-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2025-01-15T10:30:00Z"
        expiryDate:
          type: string
          format: date-time
          nullable: true
          example: "2025-11-15T23:59:59Z"
        cancellationPolicy:
          type: object
          properties:
            cancellable:
              type: boolean
              example: true
            refundable:
              type: boolean
              example: true
            cancellationFee:
              type: number
              format: float
              example: 50.00
            deadlineDate:
              type: string
              format: date-time
              example: "2025-11-10T23:59:59Z"

    # Utility Schemas
    Pagination:
      type: object
      properties:
        currentPage:
          type: integer
          example: 1
        totalPages:
          type: integer
          example: 5
        totalItems:
          type: integer
          example: 48
        itemsPerPage:
          type: integer
          example: 10
        hasNextPage:
          type: boolean
          example: true
        hasPreviousPage:
          type: boolean
          example: false

