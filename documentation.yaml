                                                                  example: "FO001"
                                                                DepartureDateTime:
                                                                  type: string
                                                                  example: "2025-10-15T22:00:00"
                                                                ArrivalDateTime:
                                                                  type: string
                                                                  example: "2025-10-16T11:50:00"
