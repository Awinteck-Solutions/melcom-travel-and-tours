openapi: 3.0.3
info:
  title: Melcom Travels API
  description: |
    Comprehensive travel booking and management API for Melcom Travels & Tours

    ## Current Status (Updated: September 18, 2025)

    ### ✅ Fully Working Endpoints:
    - **Flight Deals**: Real GOL API integration - returns live special offers with airport/airline data
    - **Search Destinations**: Real GOL API integration - returns airport/city search results
    - **Flight Deal Categories**: Implementation pending placeholder
    - **Flight Bookings**: CRUD operations (placeholder implementation)

    ### ⚠️ Partially Working:
    - **Search Flights**: GOL API integration working but request payload needs DTD compliance

    ### 🔧 In Development:
    - Blog, Countries, Static Content, Contact, Analytics modules (routes configured)
    - Protected endpoints requiring JWT authentication

    ### GOL API Integration:
    Uses real GOL API (golapi.golibe.com) with proper JSON request format for flight services.
    All flight endpoints return raw GOL API responses for maximum flexibility.
  version: 1.0.0
  contact:
    name: Melcom Travels Support
    email: support@melcomtravels.com
    url: https://melcomtravels.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://api.melcomtravels.com
    description: Production server

tags:
  - name: Authentication
    description: User authentication and profile management
  - name: Flights
    description: Flight deals, search, and bookings via GOL API
  - name: Blogs
    description: Travel blog posts and categories
  - name: Countries
    description: Recommended travel destinations
  - name: Static Content
    description: Terms, privacy policy, FAQs, and contact information
  - name: Contact
    description: Contact forms and inquiry management
  - name: Analytics
    description: User interaction tracking and dashboard analytics

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Common schemas
    ApiResponse:
      type: object
      properties:
        status:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"
        data:
          type: object

    PaginationResponse:
      type: object
      properties:
        current:
          type: integer
          example: 1
        total:
          type: integer
          example: 10
        count:
          type: integer
          example: 100

    # Auth schemas
    UserRegistration:
      type: object
      required: [firstname, lastname, email, password]
      properties:
        firstname:
          type: string
          example: "John"
        lastname:
          type: string
          example: "Doe"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        password:
          type: string
          minLength: 6
          example: "password123"

    UserLogin:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        password:
          type: string
          example: "password123"

    User:
      type: object
      properties:
        _id:
          type: string
          example: "60f7b3b3b3b3b3b3b3b3b3b3"
        firstname:
          type: string
          example: "John"
        lastname:
          type: string
          example: "Doe"
        email:
          type: string
          example: "john.doe@example.com"
        phone:
          type: string
          example: "+1234567890"
        dateOfBirth:
          type: string
          format: date
          example: "1990-01-15"
        address:
          type: string
          example: "123 Main St, City, Country"
        role:
          type: string
          enum: [USER, ADMIN]
          example: "USER"
        status:
          type: string
          enum: [ACTIVE, DEACTIVE]
          example: "ACTIVE"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # Flight schemas - Updated to match current GOL API integration
    FlightDealsResponse:
      type: object
      description: Raw GOL API response structure for flight deals
      properties:
        GolApi:
          type: object
          properties:
            SecurityContent:
              type: string
              example: "grznguklO9QG6BrwGGw="
            PassiveSessionId:
              type: string
              example: "116417370"
            Settings:
              type: object
              properties:
                Localization:
                  type: object
                  properties:
                    Language:
                      type: string
                      example: "en"
                    Country:
                      type: string
                      example: "CZ"
                Currency:
                  type: object
                  properties:
                    Code:
                      type: string
                      example: "GHS"
            CodeBook:
              type: object
              properties:
                Airports:
                  type: object
                  properties:
                    Airport:
                      type: array
                      items:
                        type: object
                        properties:
                          Code:
                            type: string
                            example: "ACC"
                          Country:
                            type: string
                            example: "GH"
                          $t:
                            type: string
                            example: "Accra - Kotoka"
                TransportCompanies:
                  type: object
                  properties:
                    TransportCompany:
                      type: array
                      items:
                        type: object
                        properties:
                          Code:
                            type: string
                            example: "SA"
                          Name:
                            type: object
                            properties:
                              $t:
                                type: string
                                example: "SOUTH AFRICAN AIRWAYS"
            ResponseDetail:
              type: object
              properties:
                ListSpecialoffersResponse_1:
                  type: object
                  properties:
                    ListSpecialoffers:
                      type: object
                      properties:
                        SpecialofferItem:
                          type: array
                          items:
                            type: object
                            properties:
                              SpecialOfferId:
                                type: string
                                example: "46461"
                              Type:
                                type: string
                                example: "flight"
                              MarketingAirline:
                                type: string
                                example: "SA"
                              SpecialOfferSteps:
                                type: object
                                properties:
                                  SpecialOfferStep:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        Origin:
                                          type: string
                                          example: "ACC"
                                        Destination:
                                          type: string
                                          example: "ABJ"
                              SummaryPrice:
                                type: object
                                properties:
                                  FullPrice:
                                    type: string
                                    example: "3335.00"

    SearchDestinationsResponse:
      type: object
      description: Raw GOL API response structure for destination search
      properties:
        GolApi:
          type: object
          properties:
            SecurityContent:
              type: string
              example: "DKr2WcxUDvpzrqORfnLS6Qk="
            PassiveSessionId:
              type: string
              example: "116417370"
            CodeBook:
              type: object
              properties:
                Airports:
                  type: object
                  properties:
                    Airport:
                      type: array
                      items:
                        type: object
                        properties:
                          Code:
                            type: string
                            example: "LAX"
                          Country:
                            type: string
                            example: "US"
                          State:
                            type: string
                            example: "CA"
                          Category:
                            type: string
                            example: "AIRPORT"
                          $t:
                            type: string
                            example: "Los Angeles"
            ResponseDetail:
              type: object
              properties:
                SearchDestinationsResponse_1:
                  type: object
                  properties:
                    SearchedAirports:
                      type: object
                      properties:
                        SearchedAirport:
                          type: array
                          items:
                            type: object
                            properties:
                              Destination:
                                type: string
                                example: "LAX"
                              Parent:
                                type: string
                                example: "LAX+"
                              ShowCode:
                                type: string
                                example: "true"

    SearchFlightsRequestDto:
      type: object
      description: Request DTO for flight search
      required: [origin, destination, date]
      properties:
        origin:
          type: string
          example: "ACC"
          description: Origin airport code
        destination:
          type: string
          example: "LAX"
          description: Destination airport code
        date:
          type: string
          format: date
          example: "2025-10-26"
          description: Departure date (YYYY-MM-DD)

    SearchDestinationsRequestDto:
      type: object
      description: Request DTO for destination search
      properties:
        query:
          type: string
          example: "Los Angeles"
          description: Search term for airport or city

    FlightDeal:
      type: object
      deprecated: true
      description: "Legacy schema - now using raw GOL API responses"
      properties:
        id:
          type: string
          example: "1"
        from:
          type: string
          example: "ACC"
        to:
          type: string
          example: "LHR"
        price:
          type: number
          example: 850
        currency:
          type: string
          example: "USD"
        airline:
          type: string
          example: "British Airways"
        departureDate:
          type: string
          format: date
          example: "2025-10-15"
        returnDate:
          type: string
          format: date
          example: "2025-10-25"
        category:
          type: string
          example: "international"
        discount:
          type: number
          example: 15
        image:
          type: string
          example: "https://example.com/london.jpg"

    FlightBooking:
      type: object
      properties:
        flightId:
          type: string
          example: "1"
        passenger:
          type: object
          properties:
            firstName:
              type: string
              example: "John"
            lastName:
              type: string
              example: "Doe"
            email:
              type: string
              example: "john.doe@example.com"
            phone:
              type: string
              example: "+1234567890"
            dateOfBirth:
              type: string
              format: date
              example: "1990-01-15"
            passportNumber:
              type: string
              example: "A1234567"
        seatPreference:
          type: string
          example: "Window"
        specialRequests:
          type: string
          example: "Vegetarian meal"

    # Blog schemas
    Blog:
      type: object
      properties:
        title:
          type: string
          example: "Top 10 Destinations for 2025"
        content:
          type: string
          example: "Discover the most amazing travel destinations..."
        excerpt:
          type: string
          example: "A brief overview of top destinations"
        featuredImage:
          type: string
          example: "https://example.com/blog-image.jpg"
        category:
          type: string
          example: "60f7b3b3b3b3b3b3b3b3b3b3"
        tags:
          type: array
          items:
            type: string
          example: ["travel", "destinations", "2025"]
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
          example: "PUBLISHED"
        featured:
          type: boolean
          example: true
        seoTitle:
          type: string
          example: "Best Travel Destinations 2025 | Melcom Travels"
        seoDescription:
          type: string
          example: "Discover the top travel destinations for 2025"
        seoKeywords:
          type: array
          items:
            type: string
          example: ["travel", "destinations", "vacation"]

    # Country schemas
    RecommendedCountry:
      type: object
      properties:
        name:
          type: string
          example: "United Kingdom"
        code:
          type: string
          example: "GB"
        image:
          type: string
          example: "https://example.com/uk.jpg"
        numberOfDestinations:
          type: integer
          example: 25
        description:
          type: string
          example: "Explore historic castles and vibrant cities"
        continent:
          type: string
          enum:
            [
              Africa,
              Asia,
              Europe,
              North America,
              South America,
              Australia,
              Antarctica,
            ]
          example: "Europe"
        currency:
          type: string
          example: "GBP"
        language:
          type: string
          example: "English"
        bestTimeToVisit:
          type: string
          example: "May to September"
        averageTemperature:
          type: string
          example: "10-20°C"
        featured:
          type: boolean
          example: true
        popular:
          type: boolean
          example: true

    # Contact schemas
    ContactForm:
      type: object
      required: [firstName, lastName, email, inquiryType, subject, message]
      properties:
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Doe"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        phone:
          type: string
          example: "+1234567890"
        inquiryType:
          type: string
          example: "60f7b3b3b3b3b3b3b3b3b3b3"
        subject:
          type: string
          example: "Flight booking inquiry"
        message:
          type: string
          example: "I need help with booking a flight to London"
        attachments:
          type: array
          items:
            type: object
            properties:
              filename:
                type: string
                example: "document.pdf"
              url:
                type: string
                example: "https://example.com/uploads/document.pdf"
              mimeType:
                type: string
                example: "application/pdf"

    # Analytics schemas
    LogEvent:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum:
            [
              SEARCH_FLIGHTS,
              CLICK_FLIGHT,
              CLICK_FLIGHT_DEAL,
              USE_PROMO,
              CLICK_BLOG,
              CLICK_FAQ,
              VIEW_COUNTRY,
              BOOK_FLIGHT,
              CANCEL_BOOKING,
              CONTACT_FORM,
              LOGIN,
              REGISTER,
              VIEW_PAGE,
            ]
          example: "SEARCH_FLIGHTS"
        metadata:
          type: object
          properties:
            from:
              type: string
              example: "ACC"
            to:
              type: string
              example: "LHR"
            passengers:
              type: integer
              example: 2
            flightType:
              type: string
              example: "round-trip"
            itemId:
              type: string
              example: "123"
            itemType:
              type: string
              example: "blog"
            itemTitle:
              type: string
              example: "Travel Tips"

paths:
  # ================================
  # API STATUS SUMMARY
  # ================================
  # ✅ FULLY WORKING:
  #   - GET /airports?search={term} - Real GOL API integration
  #   - GET /flight-deals - Mock data (2 deals)
  #   - GET /flight-deals/{id} - Single deal retrieval
  #   - GET /flight-deals-categories - 4 categories
  #   - GET /flight-status/{bookingRef} - GOL API integration
  #
  # ⚠️  PARTIALLY WORKING:
  #   - GET /flight-search - Responds but needs DTD format refinement
  #
  # 🔧 IN DEVELOPMENT:
  #   - Authentication endpoints (routes configured)
  #   - Blog, Countries, Static Content, Contact, Analytics modules
  #   - Protected endpoints requiring JWT authentication
  # ================================

  # Authentication endpoints
  /signup:
    post:
      tags: [Authentication]
      summary: Register new user
      description: |
        **🔧 IN DEVELOPMENT** - Create a new user account

        Routes configured, needs controller implementation and database integration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistration"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"

  /login:
    post:
      tags: [Authentication]
      summary: User login
      description: Authenticate user and return access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLogin"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: "#/components/schemas/User"
                          token:
                            type: string
                            example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

  /forgot-password:
    post:
      tags: [Authentication]
      summary: Forgot password
      description: Send password reset link to user email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: "john.doe@example.com"
      responses:
        "200":
          description: Reset link sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /reset-password:
    post:
      tags: [Authentication]
      summary: Reset password
      description: Reset user password using token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                  example: "reset_token_here"
                newPassword:
                  type: string
                  example: "newpassword123"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /change-password:
    post:
      tags: [Authentication]
      summary: Change password
      description: Change current user password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  example: "oldpassword123"
                newPassword:
                  type: string
                  example: "newpassword123"
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /notification-alerts:
    get:
      tags: [Authentication]
      summary: Get user notifications
      description: Retrieve all notifications for authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notifications retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            _id:
                              type: string
                              example: "60f7b3b3b3b3b3b3b3b3b3b3"
                            title:
                              type: string
                              example: "Booking Confirmed"
                            message:
                              type: string
                              example: "Your flight booking has been confirmed"
                            type:
                              type: string
                              enum:
                                [
                                  info,
                                  warning,
                                  success,
                                  error,
                                  booking,
                                  promo,
                                  system,
                                ]
                              example: "booking"
                            read:
                              type: boolean
                              example: false
                            createdAt:
                              type: string
                              format: date-time

  /notification-alerts/{id}:
    patch:
      tags: [Authentication]
      summary: Update notification status
      description: Mark notification as read/unread
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "60f7b3b3b3b3b3b3b3b3b3b3"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [read]
              properties:
                read:
                  type: boolean
                  example: true
      responses:
        "200":
          description: Notification status updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /profile:
    get:
      tags: [Authentication]
      summary: Get user profile
      description: Retrieve authenticated user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"

    put:
      tags: [Authentication]
      summary: Update user profile
      description: Update authenticated user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstname:
                  type: string
                  example: "John"
                lastname:
                  type: string
                  example: "Doe"
                phone:
                  type: string
                  example: "+1234567890"
                dateOfBirth:
                  type: string
                  format: date
                  example: "1990-01-15"
                address:
                  type: string
                  example: "123 Main St, City, Country"
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"

  # Flight endpoints
  /flight-deals:
    get:
      tags: [Flights]
      summary: Get flight deals
      description: |
        **✅ FULLY WORKING** - Retrieve flight deals using GOL API integration
        Returns real special offers with airport codes, airline information, and prices in GHS
      parameters:
        - name: category
          in: query
          schema:
            type: string
          example: "flight"
          description: Optional category filter
      responses:
        "200":
          description: Flight deals retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          GolApi:
                            type: object
                            properties:
                              SecurityContent:
                                type: string
                                example: "grznguklO9QG6BrwGGw="
                              PassiveSessionId:
                                type: string
                                example: "116417370"
                              Settings:
                                type: object
                                properties:
                                  Localization:
                                    type: object
                                    properties:
                                      Language:
                                        type: string
                                        example: "en"
                                      Country:
                                        type: string
                                        example: "CZ"
                                  Currency:
                                    type: object
                                    properties:
                                      Code:
                                        type: string
                                        example: "GHS"
                              CodeBook:
                                type: object
                                properties:
                                  Airports:
                                    type: object
                                    properties:
                                      Airport:
                                        type: array
                                        items:
                                          type: object
                                          properties:
                                            Code:
                                              type: string
                                              example: "ACC"
                                            Parent:
                                              type: string
                                              example: ""
                                            Country:
                                              type: string
                                              example: "GH"
                                            State:
                                              type: string
                                              example: ""
                                            $t:
                                              type: string
                                              example: "Accra - Kotoka"
                                  TransportCompanies:
                                    type: object
                                    properties:
                                      TransportCompany:
                                        type: array
                                        items:
                                          type: object
                                          properties:
                                            Type:
                                              type: string
                                              example: "company"
                                            Code:
                                              type: string
                                              example: "SA"
                                            Name:
                                              type: object
                                              properties:
                                                $t:
                                                  type: string
                                                  example:
                                                    "SOUTH AFRICAN AIRWAYS"
                                            LogoUrl:
                                              type: object
                                              properties:
                                                $t:
                                                  type: string
                                                  example: "https://fs.golibe.com/cache/ao-467170-SA.png"
                              ResponseDetail:
                                type: object
                                properties:
                                  ListSpecialoffersResponse_1:
                                    type: object
                                    properties:
                                      ListSpecialoffers:
                                        type: object
                                        properties:
                                          SpecialofferItem:
                                            type: array
                                            items:
                                              type: object
                                              properties:
                                                SpecialOfferId:
                                                  type: string
                                                  example: "46461"
                                                Type:
                                                  type: string
                                                  example: "flight"
                                                MarketingAirline:
                                                  type: string
                                                  example: "SA"
                                                SpecialOfferSteps:
                                                  type: object
                                                  properties:
                                                    SpecialOfferStep:
                                                      type: array
                                                      items:
                                                        type: object
                                                        properties:
                                                          Origin:
                                                            type: string
                                                            example: "ACC"
                                                          Destination:
                                                            type: string
                                                            example: "ABJ"
                                                          DateRange:
                                                            type: object
                                                            properties:
                                                              DateFrom:
                                                                type: string
                                                                example: "2025-09-01"
                                                              DateTo:
                                                                type: string
                                                                example: "2025-11-30"
                                                SummaryPrice:
                                                  type: object
                                                  properties:
                                                    FullPrice:
                                                      type: string
