openapi: 3.0.3
info:
  title: Melcom Travels API
  description: |
    Comprehensive travel booking and management API for Melcom Travels & Tours

    ## Current Status (Updated: September 26, 2025)

    ### ✅ Fully Working Endpoints:
    - **Flight Deals**: Real GOL API integration - returns live special offers with airport/airline data
    - **Search Destinations**: Real GOL API integration - returns airport/city search results  
    - **Flexible Search**: Universal endpoint accepting any payload structure
    - **One-Way Flight Search**: DTD compliant with passenger type transformation
    - **Round-Trip Flight Search**: Complete multi-leg search with real pricing
    - **Multi-City Flight Search**: Complex itinerary search with flexible inputs
    - **Flight Deal Categories**: Implementation pending placeholder
    - **Flight Bookings**: CRUD operations (placeholder implementation)

    ### 🚀 Latest Updates:
    - **Maximum Flexibility**: All flight search endpoints now accept flexible input formats
    - **Passenger Type Transformation**: Converts common names ('adults', 'children') to GOL API codes ('ADT', 'CHD')
    - **DTD Compliance**: All endpoints pass XML validation and return real flight data
    - **Real Flight Results**: Live pricing, schedules, airlines, and booking details

    ### 🔧 In Development:
    - Blog, Countries, Static Content, Contact, Analytics modules (routes configured)
    - Protected endpoints requiring JWT authentication

    ### GOL API Integration:
    Uses real GOL API (golapi.golibe.com) with proper XML DTD compliance.
    All flight endpoints return comprehensive GOL API responses with real flight data, pricing, and availability.
  version: 1.0.0
  contact:
    name: Melcom Travels Support
    email: support@melcomtravels.com
    url: https://melcomtravels.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://api.melcomtravels.com
    description: Production server

tags:
  - name: Authentication
    description: User authentication and profile management
  - name: Flights
    description: Flight deals, search, and bookings via GOL API
  - name: Blogs
    description: Travel blog posts and categories
  - name: Countries
    description: Recommended travel destinations
  - name: Static Content
    description: Terms, privacy policy, FAQs, and contact information
  - name: Contact
    description: Contact forms and inquiry management
  - name: Analytics
    description: User interaction tracking and dashboard analytics

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Common schemas
    ApiResponse:
      type: object
      properties:
        status:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"
        data:
          type: object

    PaginationResponse:
      type: object
      properties:
        current:
          type: integer
          example: 1
        total:
          type: integer
          example: 10
        count:
          type: integer
          example: 100

    # Auth schemas
    UserRegistration:
      type: object
      required: [firstname, lastname, email, password]
      properties:
        firstname:
          type: string
          example: "John"
        lastname:
          type: string
          example: "Doe"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        password:
          type: string
          minLength: 6
          example: "password123"

    UserLogin:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        password:
          type: string
          example: "password123"

    User:
      type: object
      properties:
        _id:
          type: string
          example: "60f7b3b3b3b3b3b3b3b3b3b3"
        firstname:
          type: string
          example: "John"
        lastname:
          type: string
          example: "Doe"
        email:
          type: string
          example: "john.doe@example.com"
        phone:
          type: string
          example: "+1234567890"
        dateOfBirth:
          type: string
          format: date
          example: "1990-01-15"
        address:
          type: string
          example: "123 Main St, City, Country"
        role:
          type: string
          enum: [USER, ADMIN]
          example: "USER"
        status:
          type: string
          enum: [ACTIVE, DEACTIVE]
          example: "ACTIVE"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # Flight schemas - Updated to match current GOL API integration
    FlightDealsResponse:
      type: object
      description: Raw GOL API response structure for flight deals
      properties:
        GolApi:
          type: object
          properties:
            SecurityContent:
              type: string
              example: "grznguklO9QG6BrwGGw="
            PassiveSessionId:
              type: string
              example: "116417370"
            Settings:
              type: object
              properties:
                Localization:
                  type: object
                  properties:
                    Language:
                      type: string
                      example: "en"
                    Country:
                      type: string
                      example: "CZ"
                Currency:
                  type: object
                  properties:
                    Code:
                      type: string
                      example: "GHS"
            CodeBook:
              type: object
              properties:
                Airports:
                  type: object
                  properties:
                    Airport:
                      type: array
                      items:
                        type: object
                        properties:
                          Code:
                            type: string
                            example: "ACC"
                          Country:
                            type: string
                            example: "GH"
                          $t:
                            type: string
                            example: "Accra - Kotoka"
                TransportCompanies:
                  type: object
                  properties:
                    TransportCompany:
                      type: array
                      items:
                        type: object
                        properties:
                          Code:
                            type: string
                            example: "SA"
                          Name:
                            type: object
                            properties:
                              $t:
                                type: string
                                example: "SOUTH AFRICAN AIRWAYS"
            ResponseDetail:
              type: object
              properties:
                ListSpecialoffersResponse_1:
                  type: object
                  properties:
                    ListSpecialoffers:
                      type: object
                      properties:
                        SpecialofferItem:
                          type: array
                          items:
                            type: object
                            properties:
                              SpecialOfferId:
                                type: string
                                example: "46461"
                              Type:
                                type: string
                                example: "flight"
                              MarketingAirline:
                                type: string
                                example: "SA"
                              SpecialOfferSteps:
                                type: object
                                properties:
                                  SpecialOfferStep:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        Origin:
                                          type: string
                                          example: "ACC"
                                        Destination:
                                          type: string
                                          example: "ABJ"
                              SummaryPrice:
                                type: object
                                properties:
                                  FullPrice:
                                    type: string
                                    example: "3335.00"

    SearchDestinationsResponse:
      type: object
      description: Raw GOL API response structure for destination search
      properties:
        GolApi:
          type: object
          properties:
            SecurityContent:
              type: string
              example: "DKr2WcxUDvpzrqORfnLS6Qk="
            PassiveSessionId:
              type: string
              example: "116417370"
            CodeBook:
              type: object
              properties:
                Airports:
                  type: object
                  properties:
                    Airport:
                      type: array
                      items:
                        type: object
                        properties:
                          Code:
                            type: string
                            example: "LAX"
                          Country:
                            type: string
                            example: "US"
                          State:
                            type: string
                            example: "CA"
                          Category:
                            type: string
                            example: "AIRPORT"
                          $t:
                            type: string
                            example: "Los Angeles"
            ResponseDetail:
              type: object
              properties:
                SearchDestinationsResponse_1:
                  type: object
                  properties:
                    SearchedAirports:
                      type: object
                      properties:
                        SearchedAirport:
                          type: array
                          items:
                            type: object
                            properties:
                              Destination:
                                type: string
                                example: "LAX"
                              Parent:
                                type: string
                                example: "LAX+"
                              ShowCode:
                                type: string
                                example: "true"

    SearchFlightsRequestDto:
      type: object
      description: Request DTO for flight search
      required: [origin, destination, date]
      properties:
        origin:
          type: string
          example: "ACC"
          description: Origin airport code
        destination:
          type: string
          example: "LAX"
          description: Destination airport code
        date:
          type: string
          format: date
          example: "2025-10-26"
          description: Departure date (YYYY-MM-DD)

    SearchDestinationsRequestDto:
      type: object
      description: Request DTO for destination search
      properties:
        query:
          type: string
          example: "Los Angeles"
          description: Search term for airport or city

    FlightDeal:
      type: object
      deprecated: true
      description: "Legacy schema - now using raw GOL API responses"
      properties:
        id:
          type: string
          example: "1"
        from:
          type: string
          example: "ACC"
        to:
          type: string
          example: "LHR"
        price:
          type: number
          example: 850
        currency:
          type: string
          example: "USD"
        airline:
          type: string
          example: "British Airways"
        departureDate:
          type: string
          format: date
          example: "2025-10-15"
        returnDate:
          type: string
          format: date
          example: "2025-10-25"
        category:
          type: string
          example: "international"
        discount:
          type: number
          example: 15
        image:
          type: string
          example: "https://example.com/london.jpg"

    FlightBooking:
      type: object
      properties:
        flightId:
          type: string
          example: "1"
        passenger:
          type: object
          properties:
            firstName:
              type: string
              example: "John"
            lastName:
              type: string
              example: "Doe"
            email:
              type: string
              example: "john.doe@example.com"
            phone:
              type: string
              example: "+1234567890"
            dateOfBirth:
              type: string
              format: date
              example: "1990-01-15"
            passportNumber:
              type: string
              example: "A1234567"
        seatPreference:
          type: string
          example: "Window"
        specialRequests:
          type: string
          example: "Vegetarian meal"

    # Blog schemas
    Blog:
      type: object
      properties:
        title:
          type: string
          example: "Top 10 Destinations for 2025"
        content:
          type: string
          example: "Discover the most amazing travel destinations..."
        excerpt:
          type: string
          example: "A brief overview of top destinations"
        featuredImage:
          type: string
          example: "https://example.com/blog-image.jpg"
        category:
          type: string
          example: "60f7b3b3b3b3b3b3b3b3b3b3"
        tags:
          type: array
          items:
            type: string
          example: ["travel", "destinations", "2025"]
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
          example: "PUBLISHED"
        featured:
          type: boolean
          example: true
        seoTitle:
          type: string
          example: "Best Travel Destinations 2025 | Melcom Travels"
        seoDescription:
          type: string
          example: "Discover the top travel destinations for 2025"
        seoKeywords:
          type: array
          items:
            type: string
          example: ["travel", "destinations", "vacation"]

    # Country schemas
    RecommendedCountry:
      type: object
      properties:
        name:
          type: string
          example: "United Kingdom"
        code:
          type: string
          example: "GB"
        image:
          type: string
          example: "https://example.com/uk.jpg"
        numberOfDestinations:
          type: integer
          example: 25
        description:
          type: string
          example: "Explore historic castles and vibrant cities"
        continent:
          type: string
          enum:
            [
              Africa,
              Asia,
              Europe,
              North America,
              South America,
              Australia,
              Antarctica,
            ]
          example: "Europe"
        currency:
          type: string
          example: "GBP"
        language:
          type: string
          example: "English"
        bestTimeToVisit:
          type: string
          example: "May to September"
        averageTemperature:
          type: string
          example: "10-20°C"
        featured:
          type: boolean
          example: true
        popular:
          type: boolean
          example: true

    # Contact schemas
    ContactForm:
      type: object
      required: [firstName, lastName, email, inquiryType, subject, message]
      properties:
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Doe"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        phone:
          type: string
          example: "+1234567890"
        inquiryType:
          type: string
          example: "60f7b3b3b3b3b3b3b3b3b3b3"
        subject:
          type: string
          example: "Flight booking inquiry"
        message:
          type: string
          example: "I need help with booking a flight to London"
        attachments:
          type: array
          items:
            type: object
            properties:
              filename:
                type: string
                example: "document.pdf"
              url:
                type: string
                example: "https://example.com/uploads/document.pdf"
              mimeType:
                type: string
                example: "application/pdf"

    # Analytics schemas
    LogEvent:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum:
            [
              SEARCH_FLIGHTS,
              CLICK_FLIGHT,
              CLICK_FLIGHT_DEAL,
              USE_PROMO,
              CLICK_BLOG,
              CLICK_FAQ,
              VIEW_COUNTRY,
              BOOK_FLIGHT,
              CANCEL_BOOKING,
              CONTACT_FORM,
              LOGIN,
              REGISTER,
              VIEW_PAGE,
            ]
          example: "SEARCH_FLIGHTS"
        metadata:
          type: object
          properties:
            from:
              type: string
              example: "ACC"
            to:
              type: string
              example: "LHR"
            passengers:
              type: integer
              example: 2
            flightType:
              type: string
              example: "round-trip"
            itemId:
              type: string
              example: "123"
            itemType:
              type: string
              example: "blog"
            itemTitle:
              type: string
              example: "Travel Tips"

    # Flight-related schemas
    FlightSearchResponse:
      type: object
      properties:
        status:
          type: boolean
          example: true
        message:
          type: string
          example: "Flight search completed successfully"
        data:
          type: object
          properties:
            GolApi:
              type: object
              properties:
                PassiveSessionId:
                  type: string
                  example: "116419946"
                Settings:
                  type: object
                ResponseDetail:
                  type: object
                  properties:
                    SearchFlightsResponse_2:
                      type: object
                      properties:
                        Offers:
                          type: object
                          properties:
                            Offer:
                              type: array
                              items:
                                $ref: "#/components/schemas/FlightOffer"

    FlightOffer:
      type: object
      properties:
        FlightItinerary:
          type: object
          properties:
            FlightStream:
              type: array
              items:
                type: object
                properties:
                  FlightOption:
                    type: array
                    items:
                      $ref: "#/components/schemas/FlightOption"
        PricingDetails:
          type: object
          properties:
            PricingDetail:
              type: array
              items:
                $ref: "#/components/schemas/PricingDetail"

    FlightOption:
      type: object
      properties:
        Key:
          type: string
          example: "FO001"
        DepartureDateTime:
          type: string
          example: "2025-10-15T22:00:00"
        ArrivalDateTime:
          type: string
          example: "2025-10-16T11:50:00"
        JourneyDuration:
          type: string
          example: "PT20H50M"
        FlightSegments:
          type: object
          properties:
            FlightSegment:
              type: array
              items:
                $ref: "#/components/schemas/FlightSegment"

    FlightSegment:
      type: object
      properties:
        FlightNumber:
          type: string
          example: "9373"
        OriginAirport:
          type: string
          example: "ACC"
        DestinationAirport:
          type: string
          example: "LAX"
        DepartureDateTime:
          type: string
          example: "2025-10-15T22:00:00"
        ArrivalDateTime:
          type: string
          example: "2025-10-16T06:45:00"
        MarketingAirline:
          type: string
          example: "DL"
        OperatingAirline:
          type: string
          example: "KL"
        CabinClass:
          type: string
          example: "Economy"
        PlaneType:
          type: string
          example: "77W"

    PricingDetail:
      type: object
      properties:
        Key:
          type: string
          example: "PD001"
        FlightPricing:
          type: object
          properties:
            FlightPrice:
              type: object
              properties:
                BasePrice:
                  type: string
                  example: "20000.00"
                OperatorFee:
                  type: string
                  example: "100.00"
                FullPrice:
                  type: string
                  example: "27120.00"
                DisplayPricePerPassenger:
                  type: string
                  example: "27120.00"

    DestinationSearchResponse:
      type: object
      properties:
        PassiveSessionId:
          type: string
          example: "116417370"
        Settings:
          type: object
        CodeBook:
          type: object
          properties:
            Airports:
              type: object
              properties:
                Airport:
                  type: array
                  items:
                    type: object
                    properties:
                      Code:
                        type: string
                        example: "LAX"
                      Parent:
                        type: string
                        example: "LAX+"
                      Country:
                        type: string
                        example: "US"
                      State:
                        type: string
                        example: "CA"
                      Category:
                        type: string
                        example: "AIRPORT"
                      $t:
                        type: string
                        example: "Los Angeles"

paths:
  # ================================
  # API STATUS SUMMARY (Updated: September 26, 2025)
  # ================================
  # ✅ FULLY WORKING:
  #   - POST /flexible-search - Universal flight search endpoint
  #   - POST /search-flights - Flexible flight search with passenger transformation
  #   - POST /search-flights-oneway - One-way flight search (DTD compliant)
  #   - POST /search-flights-roundtrip - Round-trip flight search with pricing
  #   - POST /search-multicity-flights - Multi-city flight search
  #   - POST /search-destinations-exact - Destination search (exact payload)
  #   - POST /search-flights-multicity-exact - Multi-city search (exact payload)
  #   - GET /search-destinations - Airport/city search (GOL API)
  #   - GET /flight-deals - Mock data (2 deals)
  #   - GET /flight-deals/{id} - Single deal retrieval
  #   - GET /flight-deals-categories - 4 categories
  #
  # 🚀 LATEST UPDATES:
  #   - All flight search endpoints now fully working with real data
  #   - Passenger type transformation (adults → ADT, children → CHD)
  #   - DTD validation compliance achieved
  #   - Flexible input formats with exact GOL API compliance
  #
  # 🔧 IN DEVELOPMENT:
  #   - Authentication endpoints (routes configured)
  #   - Blog, Countries, Static Content, Contact, Analytics modules
  #   - Protected endpoints requiring JWT authentication
  # ================================

  # Authentication endpoints
  /signup:
    post:
      tags: [Authentication]
      summary: Register new user
      description: |
        **🔧 IN DEVELOPMENT** - Create a new user account

        Routes configured, needs controller implementation and database integration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistration"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"

  /login:
    post:
      tags: [Authentication]
      summary: User login
      description: Authenticate user and return access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLogin"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: "#/components/schemas/User"
                          token:
                            type: string
                            example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

  /forgot-password:
    post:
      tags: [Authentication]
      summary: Forgot password
      description: Send password reset link to user email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: "john.doe@example.com"
      responses:
        "200":
          description: Reset link sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /reset-password:
    post:
      tags: [Authentication]
      summary: Reset password
      description: Reset user password using token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                  example: "reset_token_here"
                newPassword:
                  type: string
                  example: "newpassword123"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /change-password:
    post:
      tags: [Authentication]
      summary: Change password
      description: Change current user password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  example: "oldpassword123"
                newPassword:
                  type: string
                  example: "newpassword123"
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /notification-alerts:
    get:
      tags: [Authentication]
      summary: Get user notifications
      description: Retrieve all notifications for authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notifications retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            _id:
                              type: string
                              example: "60f7b3b3b3b3b3b3b3b3b3b3"
                            title:
                              type: string
                              example: "Booking Confirmed"
                            message:
                              type: string
                              example: "Your flight booking has been confirmed"
                            type:
                              type: string
                              enum:
                                [
                                  info,
                                  warning,
                                  success,
                                  error,
                                  booking,
                                  promo,
                                  system,
                                ]
                              example: "booking"
                            read:
                              type: boolean
                              example: false
                            createdAt:
                              type: string
                              format: date-time

  /notification-alerts/{id}:
    patch:
      tags: [Authentication]
      summary: Update notification status
      description: Mark notification as read/unread
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "60f7b3b3b3b3b3b3b3b3b3b3"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [read]
              properties:
                read:
                  type: boolean
                  example: true
      responses:
        "200":
          description: Notification status updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /profile:
    get:
      tags: [Authentication]
      summary: Get user profile
      description: Retrieve authenticated user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"

    put:
