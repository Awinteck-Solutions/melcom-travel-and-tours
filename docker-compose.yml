services:
  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_URL=mongodb://mongodb:27017/melcom-travels
      - JWT_SECRET=your_jwt_secret_key
    restart: unless-stopped
    depends_on:
      - mongodb
    networks:
      - app-network

  mongodb:
    image: mongo:7.0
    # restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=melcom-travels
    volumes:
      - mongodb-data:/data/db
    networks:
      - app-network

volumes:
  mongodb-data:

networks:
  app-network:
    driver: bridge
